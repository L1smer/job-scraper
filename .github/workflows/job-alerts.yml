name: job-alerts

on:
  schedule:
    - cron: "0 */1 * * *" # Runs every hour
  workflow_dispatch: {} # "Run workflow" button for manual tests

permissions:
  contents: write # needed to commit seen_jobs.json back

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scraper.main

      - name: Save seen jobs
        if: success() || failure()
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update seen jobs"
          git pull --rebase -X theirs || true
          git push
