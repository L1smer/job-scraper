name: job-alerts

on:
  schedule:
    # Every hour at :17. Avoid minute 0: GitHub's scheduler is overloaded at the top of
    # the hour and delays or drops those runs. Missed runs are caught up automatically.
    - cron: "17 * * * *"
  workflow_dispatch:          # "Run workflow" button
    inputs:
      test_hours:
        description: "TEST MODE: send up to 3 matches per platform from the last N hours (e.g. 48). Ignores and doesn't change seen jobs. Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: write # needed to commit seen_jobs.json back

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_HOURS: ${{ inputs.test_hours }}
        run: |
          if [ -n "$TEST_HOURS" ]; then
            python -m scraper.main --test "$TEST_HOURS"
          else
            python -m scraper.main
          fi

      - name: Save seen jobs
        if: success() || failure()
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update seen jobs"
          git pull --rebase -X theirs || true
          git push
